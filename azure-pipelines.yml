# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  - main

pool:
  name: NayaInfra

variables:
  app1Path: '$(Build.SourcesDirectory)/ApplicationsOnly/aaya-saawan-jhoom-ke'
  app2Path: '$(Build.SourcesDirectory)/ApplicationsOnly/rang-de-basanti'

steps:

# =========================================================
# 1. VERIFY DOCKERFILES EXIST
# =========================================================

- powershell: |
    Write-Host "Checking App1 Dockerfile: $(app1Path)\Dockerfile"
    if (!(Test-Path "$(app1Path)\Dockerfile")) {
        Write-Host "ERROR: Aaya Saawan Dockerfile not found at $(app1Path)"
        exit 1
    }
    Write-Host "App1 Dockerfile FOUND."

    Write-Host "Checking App2 Dockerfile: $(app2Path)\Dockerfile"
    if (!(Test-Path "$(app2Path)\Dockerfile")) {
        Write-Host "ERROR: Rang De Basanti Dockerfile not found at $(app2Path)"
        exit 1
    }
    Write-Host "App2 Dockerfile FOUND."

  displayName: 'Verify Dockerfiles'


# =========================================================
# 2. BUILD AAYA SAAWAN IMAGE
# =========================================================

- task: Docker@2
  displayName: 'Build Aaya Saawan Image'
  inputs:
    command: build
    Dockerfile: '$(app1Path)/Dockerfile'
    buildContext: '$(app1Path)'
    repository: 'aaya-saawan-app'
    tags: latest


# =========================================================
# 3. BUILD RANG DE BASANTI IMAGE
# =========================================================

- task: Docker@2
  displayName: 'Build Rang De Basanti Image'
  inputs:
    command: build
    Dockerfile: '$(app2Path)/Dockerfile'
    buildContext: '$(app2Path)'
    repository: 'rang-de-basanti'
    tags: latest


# =========================================================
# 4. RUN BOTH CONTAINERS
# =========================================================

- powershell: |
    docker rm -f aaya-saawan-container 2>$null
    docker rm -f rang-de-basanti-container 2>$null

    docker run -d --name aaya-saawan-container -p 8081:80 --restart unless-stopped aaya-saawan-app:latest
    docker run -d --name rang-de-basanti-container -p 8082:80 --restart unless-stopped rang-de-basanti:latest

    Start-Sleep -Seconds 5
    docker ps

  displayName: 'Run Both Containers'


# =========================================================
# 5. TEST BOTH APPLICATIONS
# =========================================================

- powershell: |
    $urls = @{ "Aaya Saawan" = "http://localhost:8081"; "Rang De Basanti" = "http://localhost:8082" }
    $containers = @{ "Aaya Saawan" = "aaya-saawan-container"; "Rang De Basanti" = "rang-de-basanti-container" }

    foreach ($name in $urls.Keys) {
        $url = $urls[$name]
        try {
            $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10
            Write-Host "$name -> $($r.StatusCode)"
            if ($r.StatusCode -ne 200) { exit 1 }
        }
        catch {
            Write-Host "ERROR: $name not reachable at $url"
            docker logs $($containers[$name])
            exit 1
        }
    }

    Write-Host "Both apps running fine."

  displayName: 'Test Both Applications'
