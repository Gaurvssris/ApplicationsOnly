# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  - main

pool:
  name: NayaInfra

steps:

# =========================================================
# 1. FIND DOCKERFILES AUTOMATICALLY
# =========================================================

- powershell: |
    Write-Host "Searching for Dockerfiles in repo..."

    $dockerfiles = Get-ChildItem -Path "$(Build.SourcesDirectory)" -Recurse -Filter "Dockerfile" -File

    if ($dockerfiles.Count -lt 2) {
        Write-Host "ERROR: Expected at least 2 Dockerfiles, found $($dockerfiles.Count)"
        $dockerfiles | ForEach-Object { Write-Host $_.FullName }
        exit 1
    }

    $app1 = $dockerfiles | Where-Object { $_.FullName -match "aaya-sawan-jhoom-ke" } | Select-Object -First 1
    $app2 = $dockerfiles | Where-Object { $_.FullName -match "rang-de-basanti" } | Select-Object -First 1

    if (-not $app1) {
        Write-Host "ERROR: Aaya Saawan Dockerfile not found!"
        exit 1
    }
    if (-not $app2) {
        Write-Host "ERROR: Rang De Basanti Dockerfile not found!"
        exit 1
    }

    Write-Host "App1 Dockerfile: $($app1.FullName)"
    Write-Host "App2 Dockerfile: $($app2.FullName)"

    Write-Host "##vso[task.setvariable variable=app1Dockerfile]$($app1.FullName)"
    Write-Host "##vso[task.setvariable variable=app1Context]$($app1.DirectoryName)"
    Write-Host "##vso[task.setvariable variable=app2Dockerfile]$($app2.FullName)"
    Write-Host "##vso[task.setvariable variable=app2Context]$($app2.DirectoryName)"

  displayName: 'Find Dockerfiles'


# =========================================================
# 2. BUILD AAYA SAAWAN IMAGE
# =========================================================

- task: Docker@2
  displayName: 'Build Aaya Saawan Image'
  inputs:
    command: build
    Dockerfile: '$(app1Dockerfile)'
    buildContext: '$(app1Context)'
    repository: 'aaya-saawan-app'
    tags: latest


# =========================================================
# 3. BUILD RANG DE BASANTI IMAGE
# =========================================================

- task: Docker@2
  displayName: 'Build Rang De Basanti Image'
  inputs:
    command: build
    Dockerfile: '$(app2Dockerfile)'
    buildContext: '$(app2Context)'
    repository: 'rang-de-basanti'
    tags: latest


# =========================================================
# 4. RUN BOTH CONTAINERS
# =========================================================

- powershell: |
    docker rm -f aaya-saawan-container 2>$null
    docker rm -f rang-de-basanti-container 2>$null

    docker run -d --name aaya-saawan-container -p 8081:80 --restart unless-stopped aaya-saawan-app:latest
    docker run -d --name rang-de-basanti-container -p 8082:80 --restart unless-stopped rang-de-basanti:latest

    Start-Sleep -Seconds 5
    docker ps

  displayName: 'Run Both Containers'


# =========================================================
# 5. TEST BOTH APPLICATIONS
# =========================================================

- powershell: |
    $urls = @{ "Aaya Saawan" = "http://localhost:8081"; "Rang De Basanti" = "http://localhost:8082" }
    $containers = @{ "Aaya Saawan" = "aaya-saawan-container"; "Rang De Basanti" = "rang-de-basanti-container" }

    foreach ($name in $urls.Keys) {
        $url = $urls[$name]
        try {
            $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10
            Write-Host "$name -> $($r.StatusCode)"
            if ($r.StatusCode -ne 200) { exit 1 }
        }
        catch {
            Write-Host "ERROR: $name not reachable at $url"
            docker logs $($containers[$name])
            exit 1
        }
    }

    Write-Host "Both apps running fine."

  displayName: 'Test Both Applications'
