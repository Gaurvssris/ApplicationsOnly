<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rang De Basanti Chola</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 20% 30%, #ff512f, transparent 35%),
                radial-gradient(circle at 80% 70%, #dd2476, transparent 35%),
                linear-gradient(135deg, #ff6a00, #ee0979, #7f00ff);

            animation: backgroundMove 8s infinite alternate;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .title {
            font-size: clamp(55px, 10vw, 180px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 8px;

            background: linear-gradient(
                90deg,
                #ff0000,
                #ff8c00,
                #ffff00,
                #00ff00,
                #00ffff,
                #008cff,
                #ff00ff,
                #ff0000
            );

background-size: 400% 400%;

background-clip: text;
-webkit-background-clip: text;

color: transparent;
-webkit-text-fill-color: transparent;

            animation:
                gradient 5s linear infinite,
                zoom 2s ease-in-out infinite alternate;

            text-shadow:
                0 0 20px rgba(255,255,255,0.5),
                0 0 40px rgba(255,0,150,0.5);
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 20px white;
            animation: float 6s infinite ease-in-out;
        }

        .p1 { left: 10%; top: 20%; animation-delay: 0s; }
        .p2 { left: 20%; top: 70%; animation-delay: 1s; }
        .p3 { left: 80%; top: 20%; animation-delay: 2s; }
        .p4 { left: 90%; top: 75%; animation-delay: 3s; }
        .p5 { left: 50%; top: 10%; animation-delay: 1.5s; }
        .p6 { left: 60%; top: 85%; animation-delay: 2.5s; }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 400% 50%;
            }
        }

        @keyframes zoom {
            from {
                transform: scale(0.95);
            }
            to {
                transform: scale(1.05);
            }
        }

        @keyframes backgroundMove {
            from {
                filter: hue-rotate(0deg);
            }
            to {
                filter: hue-rotate(45deg);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-100px) scale(2);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
        <div class="particle p6"></div>

        <div class="title">
            Rang De Basanti Chola
        </div>

    </div>

</body>
</html>
